<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>การเรียนรู้เทคโนโลยีสารสนเทศอย่างปลอดภัยและมีจริยธรรม</title>
<style>
  body {
    font-family: 'Comic Sans MS', Arial, sans-serif;
    background: linear-gradient(45deg, #a8edea 0%, #fed6e3 25%, #fed6e3 75%, #a8edea 100%);
    background-size: 400% 400%;
    animation: blueGradient 8s ease infinite;
    margin: 0;
    padding: 0;
    text-align: center;
    overflow-x: hidden;
    position: relative;
  }

  /* ดาวและดวงดาวลอย */
  body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: 
      radial-gradient(2px 2px at 20px 30px, #87ceeb, transparent),
      radial-gradient(2px 2px at 40px 70px, #00bfff, transparent),
      radial-gradient(1px 1px at 90px 40px, #1e90ff, transparent),
      radial-gradient(1px 1px at 130px 80px, #4169e1, transparent),
      radial-gradient(2px 2px at 160px 30px, #87ceeb, transparent);
    background-repeat: repeat;
    background-size: 200px 100px;
    animation: sparkle 20s linear infinite;
    pointer-events: none;
    z-index: -1;
  }

  @keyframes sparkle {
    from { transform: translateY(0px); }
    to { transform: translateY(-100px); }
  }

  @keyframes blueGradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* ขอบนอกสีฟ้าสดใส */
  .outer-frame {
    border: 5px solid #00bfff;
    border-radius: 35px;
    margin: 20px auto;
    max-width: 920px;
    box-sizing: border-box;
    transition: box-shadow 0.3s, transform 0.3s;
    background: linear-gradient(145deg, #fff, #f0f8ff);
  }

  .outer-frame.hover-effect {
    box-shadow: 0 0 25px rgba(0, 191, 255, 0.8), 0 0 50px rgba(135, 206, 235, 0.4);
    transform: scale(1.02);
  }

  /* ขอบขาวภายใน */
  .inner-frame {
    background: linear-gradient(135deg, #fff 0%, #f0f8ff 100%);
    border-radius: 30px;
    padding: 40px 25px;
    box-shadow: 
      0 10px 20px rgba(0,0,0,0.15),
      inset 0 2px 10px rgba(255, 255, 255, 0.8);
    box-sizing: border-box;
    position: relative;
  }

  .inner-frame::before {
    content: '✨';
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 2em;
    animation: bounce 2s infinite;
    color: #00bfff;
  }

  /* หัวข้อใหญ่ - บรรทัดเดียว + กรอบสะอาด */
  .header-text {
    display: inline-block;
    color: #000000 !important;
    font-size: clamp(1.2em, 4vw, 1.8em); /* Responsive */
    font-weight: bold;
    margin-bottom: 25px;
    padding: 12px 20px;
    border-radius: 20px;
    border: 4px solid #87ceeb;
    background: linear-gradient(45deg, rgba(0, 191, 255, 0.1), rgba(65, 105, 225, 0.1));
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
    white-space: nowrap; /* บรรทัดเดียว */
    transition: all 0.3s;
    position: relative;
  }

  .header-text:hover {
    transform: scale(1.05) rotate(1deg);
    background: linear-gradient(45deg, rgba(0, 191, 255, 0.2), rgba(65, 105, 225, 0.2));
    filter: drop-shadow(0 0 10px #00bfff);
  }

  .container h2 {
    color: #000000 !important;
    font-size: 2.2em;
    margin-bottom: 25px;
    padding: 10px;
    border-radius: 15px;
    display: inline-block;
    animation: bounce 2s infinite;
    text-shadow: 2px 2px 4px rgba(0, 191, 255, 0.3);
  }

  .container h2:hover {
    transform: scale(1.2);
    filter: drop-shadow(0 0 15px #00bfff);
  }

  /* ย่อหน้าหลัก - กรอบสะอาด */
  p {
    font-size: clamp(1em, 3vw, 1.2em); /* Responsive */
    line-height: 1.6;
    color: #000000 !important;
    padding: 20px;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 20px;
    margin: 20px auto;
    border: 4px solid #87ceeb;
    max-width: 800px;
    transition: all 0.3s;
    position: relative;
    text-align: left;
  }

  p:hover {
    transform: scale(1.02);
    background: rgba(135, 206, 235, 0.15);
    box-shadow: 0 8px 20px rgba(0, 191, 255, 0.3);
    border-color: #00bfff;
  }

  .button {
    display: inline-block;
    padding: 15px 30px;
    margin: 20px 15px 0 15px;
    background: linear-gradient(45deg, #4fc3f7, #0288d1);
    color: white;
    border-radius: 25px;
    font-size: clamp(1.1em, 3.5vw, 1.3em); /* Responsive */
    cursor: pointer;
    box-shadow: 0 6px #0277bd, 0 0 10px rgba(79, 195, 247, 0.5);
    transition: all 0.3s;
    text-decoration: none;
    position: relative;
    overflow: hidden;
  }

  .button::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transition: left 0.5s;
  }

  .button:hover::before {
    left: 100%;
  }

  .button:hover {
    transform: scale(1.15) translateY(-3px);
    box-shadow: 0 12px #0277bd, 0 0 20px rgba(79, 195, 247, 0.8);
  }

  .game-button { 
    background: linear-gradient(45deg, #00bfff, #1e90ff);
    box-shadow: 0 6px #4169e1, 0 0 10px rgba(0, 191, 255, 0.5); 
  }
  .game-button:hover { 
    background: linear-gradient(45deg, #1e90ff, #00bfff);
    box-shadow: 0 12px #4169e1, 0 0 20px rgba(0, 191, 255, 0.8);
  }

  /* รูปอยู่ในกรอบ และ interactive */
  .image-box {
    width: clamp(180px, 25vw, 220px); /* Responsive */
    margin: 25px auto 0 auto;
    padding: 15px;
    background: linear-gradient(45deg, #fff, #e6f3ff);
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0, 191, 255, 0.3);
    transition: all 0.5s;
  }

  .image-box:hover {
    transform: scale(1.3) rotate(5deg);
    box-shadow: 0 15px 30px rgba(0, 191, 255, 0.6);
  }

  .image-box img {
    width: 100%;
    border-radius: 15px;
    border: 3px solid #87ceeb;
  }

  /* Animation Bounce */
  @keyframes bounce {
    0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-20px); }
    60% { transform: translateY(-10px); }
  }

  /* Floating stars */
  .floating-star {
    position: fixed;
    font-size: 20px;
    color: #00bfff;
    pointer-events: none;
    z-index: -1;
    animation: float 6s linear infinite;
  }

  @keyframes float {
    0% {
      transform: translateY(100vh) rotate(0deg);
      opacity: 1;
    }
    100% {
      transform: translateY(-100px) rotate(360deg);
      opacity: 0;
    }
  }

  @media (max-width: 768px) {
    .inner-frame { padding: 30px 20px; }
    .header-text { padding: 10px 15px; }
    p { padding: 15px; margin: 15px auto; }
    .button { display: block; margin: 15px auto; }
  }

  @media (max-width: 480px) {
    .inner-frame { padding: 25px 15px; }
    p { font-size: 1em; }
  }
</style>
</head>
<body>
  <!-- Floating stars -->
  <div class="floating-star" style="left: 10%; animation-delay: 0s;">⭐</div>
  <div class="floating-star" style="left: 20%; animation-delay: 1s;">✨</div>
  <div class="floating-star" style="left: 80%; animation-delay: 2s;">🌟</div>
  <div class="floating-star" style="left: 90%; animation-delay: 3s;">⭐</div>

<div class="outer-frame" id="outerFrame">
  <div class="inner-frame">
    <div class="header-text">การเรียนรู้เทคโนโลยีสารสนเทศอย่างปลอดภัยและมีจริยธรรม</div>

    <div class="container">
      <h2>🎉 ยินดีต้อนรับ! 🎉</h2>
      <p>🌟 เว็บไซต์นี้ช่วยให้คุณเรียนรู้การใช้เทคโนโลยีอย่างปลอดภัย รู้จักมารยาทและจริยธรรม และเสริมสร้างทักษะการคิดอย่างมีวิจารณญาณเมื่อใช้สื่อดิจิทัล 💻✨</p>

      <a href="login.html" class="button">🚀 เข้าสู่ระบบ</a>
      <a href="register.html" class="button game-button">⭐ สมัครสมาชิก</a>

      <div class="image-box">
        <img src="img/22.jpg" alt="เด็กน่ารักใช้คอมพิวเตอร์">
      </div>
    </div>
  </div>
</div>

<script>
  // ทำให้ outer-frame มีเงาเวลาชี้ปุ่มหรือข้อความ
  const outer = document.getElementById('outerFrame');
  const interactElements = document.querySelectorAll('.header-text, h2, p, .button, .image-box');

  interactElements.forEach(el => {
    el.addEventListener('mouseenter', () => {
      outer.classList.add('hover-effect');
    });
    el.addEventListener('mouseleave', () => {
      outer.classList.remove('hover-effect');
    });
  });

  // เพิ่มดาวลอยแบบสุ่ม
  function createFloatingStar() {
    const star = document.createElement('div');
    star.className = 'floating-star';
    star.innerHTML = ['⭐', '✨', '🌟', '💫', '⭐'][Math.floor(Math.random() * 5)];
    star.style.left = Math.random() * 100 + '%';
    star.style.animationDuration = (Math.random() * 3 + 4) + 's';
    star.style.animationDelay = Math.random() * 2 + 's';
    document.body.appendChild(star);
    
    setTimeout(() => {
      star.remove();
    }, 7000);
  }

  setInterval(createFloatingStar, 1500);
</script>

</body>
</html>
