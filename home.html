<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ยินดีต้อนรับสู่การเรียนรู้จริยธรรมและเทคโนโลยี</title>
  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyDIQfBuiYzF1vWBJzTeY_OiP3gN_E4_-lY",
      authDomain: "ppp5-b59d6.firebaseapp.com",
      projectId: "ppp5-b59d6",
      storageBucket: "ppp5-b59d6.appspot.com",
      messagingSenderId: "562619004801",
      appId: "1:562619004801:web:ab2e288ddc583ef143da80",
      measurementId: "G-H1DQRS4WVE"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const quotes = [
      "📚 การเรียนรู้คือความสนุก!",
      "🌟 จงใจดีและช่วยเหลือเพื่อนเสมอ",
      "💡 ความอยากรู้ทำให้เราเก่งขึ้น",
      "🎨 ความคิดสร้างสรรค์ทำให้ชีวิตสดใส",
      "⚽ เล่นกีฬาอย่างยุติธรรมและสนุกสนาน",
      "🎵 ดนตรีทำให้หัวใจมีความสุข",
      "🌳 ออกสำรวจโลกด้วยความสนุก",
      "🎮 เกมสนุก แต่การเรียนก็สำคัญ",
      "📖 การอ่านเปิดโลกใหม่ให้เรา"
    ];

    // Check user authentication state
    onAuthStateChanged(auth, async user => {
      if (user) {
        const userDocRef = doc(db, "users", user.uid);
        const userDocSnap = await getDoc(userDocRef);
        if (userDocSnap.exists()) {
          const data = userDocSnap.data();
          const userName = user.displayName || user.email.split('@')[0];

          // Set prefix based on gender
          let prefix = "";
          if (data.gender === "ชาย") prefix = "เด็กชาย ";
          else if (data.gender === "หญิง") prefix = "เด็กหญิง ";

          // Map grade to full text
          const gradeMap = {
            "ป.1": "ประถมศึกษาปีที่ 1",
            "ป.2": "ประถมศึกษาปีที่ 2",
            "ป.3": "ประถมศึกษาปีที่ 3",
            "ป.4": "ประถมศึกษาปีที่ 4",
            "ป.5": "ประถมศึกษาปีที่ 5",
            "ป.6": "ประถมศึกษาปีที่ 6"
          };
          const fullGrade = gradeMap[data.grade] || data.grade;

          // Random avatar
          const totalAvatars = 11;
          const randomIndex = Math.floor(Math.random() * totalAvatars) + 1;
          const avatarSrc = `avatars/${randomIndex}.jpg`;

          // Update profile display
          document.getElementById("profilePhoto").src = data.photoURL || avatarSrc;
          document.getElementById("profileName").textContent = prefix + (data.name || userName);
          document.getElementById("profileGrade").textContent = "ชั้น: " + fullGrade;
          document.getElementById("profileGender").textContent = "เพศ: " + (data.gender || "");
          document.getElementById("profileNumber").textContent = "เลขที่: " + (data.number || "ไม่ระบุ");
          document.getElementById("profileSchool").textContent = "โรงเรียน: " + (data.school || "ไม่ระบุ");
          document.getElementById("profileQuote").textContent = quotes[Math.floor(Math.random() * quotes.length)];
          document.getElementById("profileContainer").style.display = "flex";

          // Update welcome text
          document.getElementById("welcomeText").textContent = "ยินดีด้วย "+prefix + (data.name || userName) + " จบการเรียนรู้แล้ว 🎉";

          // Start timer and update times
          let startTime = Date.now();
          function updateTimes() {
            const now = new Date();
            document.getElementById("currentDate").textContent = "วันที่: " + now.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
            document.getElementById("currentTime").textContent = "เวลา: " + now.toLocaleTimeString('th-TH');
            const elapsedMinutes = Math.floor((Date.now() - startTime) / 1000 / 60);
            let sessionText = elapsedMinutes < 60 ? elapsedMinutes + " นาที" : Math.floor(elapsedMinutes / 60) + " ชม. " + (elapsedMinutes % 60) + " น.";
            document.getElementById("sessionTime").textContent = "ใช้งาน: " + sessionText;
          }
          setInterval(updateTimes, 1000);
          updateTimes();

        } else {
          alert("ไม่พบข้อมูลผู้ใช้งาน");
          window.location.href = "login.html";
        }
      } else {
        window.location.href = "login.html";
      }
    });

    // Logout function
    window.logout = function() {
      signOut(auth).then(() => {
        window.location.href = "login.html";
      }).catch((error) => {
        console.log("เกิดข้อผิดพลาดตอน Logout:", error);
      });
    };

    // Toggle profile details
    window.toggleProfileDetails = function() {
      const details = document.getElementById("profileDetails");
      if (details.style.display === "block") {
        details.style.display = "none";
      } else {
        details.style.display = "block";
        details.scrollTop = 0;
      }
    };
  </script>
  <style>
    body {
      font-family: 'Comic Sans MS', Arial, sans-serif;
      background: linear-gradient(45deg, #a8edea 0%, #fed6e3 25%, #fed6e3 75%, #a8edea 100%);
      background-size: 400% 400%;
      animation: blueGradient 8s ease infinite;
      margin: 0;
      padding: 0;
      text-align: center;
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
    }

    /* ดาวลอยพื้นหลัง */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #87ceeb, transparent),
        radial-gradient(2px 2px at 40px 70px, #00bfff, transparent),
        radial-gradient(1px 1px at 90px 40px, #1e90ff, transparent),
        radial-gradient(1px 1px at 130px 80px, #4169e1, transparent),
        radial-gradient(2px 2px at 160px 30px, #87ceeb, transparent);
      background-repeat: repeat;
      background-size: 200px 100px;
      animation: sparkle 20s linear infinite;
      pointer-events: none;
      z-index: -1;
    }

    @keyframes sparkle {
      from { transform: translateY(0px); }
      to { transform: translateY(-100px); }
    }

    @keyframes blueGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* กรอบนอกใหญ่ */
    .outer-frame {
      border: 5px solid #00bfff;
      border-radius: 35px;
      margin: 20px auto;
      max-width: 920px;
      box-sizing: border-box;
      background: linear-gradient(145deg, #fff, #f0f8ff);
      transition: box-shadow 0.3s, transform 0.3s;
      min-height: calc(100vh - 60px);
      display: flex;
      flex-direction: column;
    }

    .outer-frame.hover-effect {
      box-shadow: 0 0 25px rgba(0, 191, 255, 0.8), 0 0 50px rgba(135, 206, 235, 0.4);
      transform: scale(1.02);
    }

    .inner-frame {
      background: linear-gradient(135deg, #fff 0%, #f0f8ff 100%);
      border-radius: 30px;
      padding: 40px 25px;
      box-shadow: 
        0 10px 20px rgba(0,0,0,0.15),
        inset 0 2px 10px rgba(255, 255, 255, 0.8);
      flex: 1;
      position: relative;
    }

    /* Profile Section - มุมซ้ายบน */
    .profile-container {
      position: fixed;
      top: 15px;
      left: 15px;
      display: none;
      align-items: center;
      background: linear-gradient(45deg, #fff, #e6f3ff);
      padding: 12px 18px;
      border-radius: 20px;
      border: 3px solid #87ceeb;
      box-shadow: 0 8px 20px rgba(0, 191, 255, 0.3);
      z-index: 1000;
      cursor: pointer;
      transition: all 0.3s;
    }

    .profile-container:hover { 
      transform: scale(1.05);
      box-shadow: 0 12px 25px rgba(0, 191, 255, 0.5);
    }

    .profile-img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #00bfff;
      margin-right: 10px;
    }

    .profile-name {
      font-size: 1.1em;
      color: #000000 !important;
      font-weight: bold;
      margin: 0;
      text-shadow: 1px 1px 2px rgba(0, 191, 255, 0.3);
    }

    /* กรอบวันที่เวลา - มุมขวาบน */
    .datetime-container {
      position: fixed;
      top: 15px;
      right: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(45deg, #fff, #e6f3ff);
      padding: 12px 18px;
      border-radius: 20px;
      border: 3px solid #87ceeb;
      box-shadow: 0 8px 20px rgba(0, 191, 255, 0.3);
      z-index: 1000;
      transition: all 0.3s;
    }

    .datetime-container:hover { 
      transform: scale(1.05);
      box-shadow: 0 12px 25px rgba(0, 191, 255, 0.5);
    }

    .datetime-text {
      font-size: 1em;
      color: #000000 !important;
      font-weight: bold;
      margin: 2px 0;
      text-shadow: 1px 1px 2px rgba(0, 191, 255, 0.3);
    }

    /* กรอบรายละเอียด - นอกกรอบใหญ่ + เลื่อนได้ */
    .profile-details {
      position: fixed;
      top: 80px;
      left: 15px;
      background: linear-gradient(135deg, #fff, #f0f8ff);
      padding: 25px;
      border-radius: 20px;
      border: 4px solid #87ceeb;
      box-shadow: 0 10px 25px rgba(0, 191, 255, 0.3);
      display: none;
      z-index: 1001;
      text-align: left;
      min-width: 240px;
      max-width: 300px;
      max-height: 70vh;
      overflow-y: auto;
      scrollbar-width: thin;
      transition: all 0.3s ease;
    }

    /* Custom scrollbar */
    .profile-details::-webkit-scrollbar {
      width: 6px;
    }
    .profile-details::-webkit-scrollbar-track {
      background: rgba(135, 206, 235, 0.3);
      border-radius: 10px;
    }
    .profile-details::-webkit-scrollbar-thumb {
      background: linear-gradient(#00bfff, #1e90ff);
      border-radius: 10px;
    }
    .profile-details::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(#1e90ff, #00bfff);
    }

    .profile-details p {
      margin: 12px 0;
      font-size: 1em;
      color: #000000 !important;
      border-left: 3px solid #00bfff;
      padding: 8px 10px;
      background: rgba(135, 206, 235, 0.1);
      border-radius: 8px;
      transition: all 0.2s;
    }

    .profile-details p:hover {
      background: rgba(135, 206, 235, 0.2);
      transform: translateX(3px);
    }

    .profile-button {
      display: block;
      padding: 12px 20px;
      margin: 15px 0 5px 0;
      background: linear-gradient(45deg, #00bfff, #1e90ff);
      color: white;
      border-radius: 20px;
      font-size: 1em;
      cursor: pointer;
      box-shadow: 0 6px #4169e1;
      transition: all 0.3s;
      border: none;
      width: 100%;
    }

    .profile-button:hover { 
      background: linear-gradient(45deg, #1e90ff, #00bfff);
      transform: scale(1.05) translateY(-2px);
      box-shadow: 0 10px #4169e1;
    }

    /* หัวข้อใหญ่ - บรรทัดเดียว */
    h1 { 
      color: #000000 !important;
      font-size: clamp(1.2em, 4vw, 1.8em);
      margin-bottom: 25px;
      padding: 12px 20px;
      border-radius: 20px;
      border: 4px solid #87ceeb;
      background: linear-gradient(45deg, rgba(0, 191, 255, 0.1), rgba(65, 105, 225, 0.1));
      white-space: nowrap;
      display: inline-block;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
      animation: bounce 2s infinite;
    }

    /* ย่อหน้า */
    p {
      font-size: clamp(1em, 3vw, 1.2em);
      line-height: 1.6;
      color: #000000 !important;
      padding: 20px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      margin: 20px auto;
      border: 4px solid #87ceeb;
      max-width: 800px;
      transition: all 0.3s;
    }

    p:hover {
      transform: scale(1.02);
      background: rgba(135, 206, 235, 0.15);
      box-shadow: 0 8px 20px rgba(0, 191, 255, 0.3);
      border-color: #00bfff;
    }

    .button {
      display: inline-block;
      padding: 15px 30px;
      margin: 15px;
      background: linear-gradient(45deg, #4fc3f7, #0288d1);
      color: white;
      text-decoration: none;
      border-radius: 25px;
      font-size: clamp(1.1em, 3.5vw, 1.3em);
      box-shadow: 0 6px #0277bd, 0 0 10px rgba(79, 195, 247, 0.5);
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }

    .button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: left 0.5s;
    }

    .button:hover::before { left: 100%; }
    .button:hover { 
      transform: scale(1.15) translateY(-3px);
      box-shadow: 0 12px #0277bd, 0 0 20px rgba(79, 195, 247, 0.8);
    }

    .game-button { 
      background: linear-gradient(45deg, #00bfff, #1e90ff);
      box-shadow: 0 6px #4169e1, 0 0 10px rgba(0, 191, 255, 0.5); 
    }
    .game-button:hover { 
      background: linear-gradient(45deg, #1e90ff, #00bfff);
      box-shadow: 0 12px #4169e1, 0 0 20px rgba(0, 191, 255, 0.8);
    }

    .button-container {
      margin-top: 30px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-20px); }
      60% { transform: translateY(-10px); }
    }

    /* Floating stars */
    .floating-star {
      position: fixed;
      font-size: 20px;
      color: #00bfff;
      pointer-events: none;
      z-index: -1;
      animation: float 6s linear infinite;
    }

    @keyframes float {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
    }

    @media (max-width: 768px) {
      .inner-frame { padding: 30px 20px; }
      .profile-container { padding: 10px 15px; top: 10px; left: 10px; }
      .datetime-container { padding: 10px 15px; top: 10px; right: 10px; }
      .profile-details { top: 75px; left: 10px; min-width: 220px; max-height: 60vh; }
      .profile-img { width: 45px; height: 45px; }
      .profile-name, .datetime-text { font-size: 1em; }
      .button { display: block; margin: 10px auto; }
      .button-container { flex-direction: column; align-items: center; }
    }

    @media (max-width: 480px) {
      .inner-frame { padding: 25px 15px; }
      p { font-size: 1em; padding: 15px; }
      .profile-details { min-width: 180px; padding: 20px; left: 5px; max-height: 50vh; }
      .datetime-container { padding: 8px 12px; }
      .datetime-text { font-size: 0.9em; }
    }
  </style>
</head>
<body>
  <!-- Floating stars -->
  <div class="floating-star" style="left: 10%; animation-delay: 0s;">⭐</div>
  <div class="floating-star" style="left: 20%; animation-delay: 1s;">✨</div>
  <div class="floating-star" style="left: 80%; animation-delay: 2s;">🌟</div>
  <div class="floating-star" style="left: 90%; animation-delay: 3s;">⭐</div>

  <!-- Profile Section - ซ้าย -->
  <div class="profile-container" id="profileContainer" onclick="toggleProfileDetails()">
    <img id="profilePhoto" class="profile-img" src="" alt="รูปโปรไฟล์">
    <h3 class="profile-name" id="profileName">ชื่อผู้ใช้</h3>
  </div>

  <!-- กรอบวันที่เวลา - ขวา -->
  <div class="datetime-container">
    <div class="datetime-text" id="currentDate">วันที่: 18 ตุลาคม 2568</div>
    <div class="datetime-text" id="currentTime">เวลา: 10:59:53</div>
    <div class="datetime-text" id="sessionTime">ใช้งาน: 0 นาที</div>
  </div>

  <!-- กรอบรายละเอียดนอก + เลื่อนได้ -->
  <div class="profile-details" id="profileDetails">
    <p id="profileGrade">ชั้นเรียน</p>
    <p id="profileGender">เพศ</p>
    <p id="profileNumber">เลขที่</p>
    <p id="profileSchool">โรงเรียน</p>
    <p id="profileQuote">คำคม</p>
    <button class="profile-button" onclick="logout()">🚪 ออกจากระบบ</button>
  </div>

  <div class="outer-frame" id="outerFrame">
    <div class="inner-frame">
      <h1 id="welcomeText">ยินดีด้วยจบการเรียนรู้แล้ว 🎉</h1>
      <p>🌟 มาทบทวนการเรียนรู้วิธีใช้เทคโนโลยีอย่างปลอดภัยและมีจริยธรรมกันเถอะ! 💻✨</p>

      <div class="button-container">
        <a href="lessons.html" class="button">📘 เริ่มเรียน</a>
        <a href="https://g.co/gemini/share/a7ec6c4fa0df" target="_blank" class="button game-button">📖 อ่านนิทาน</a>
        <a href="games.html" class="button game-button">🎮 เล่นเกม</a>
      </div>
    </div>
  </div>

  <script>
    // Hover effect สำหรับ outer-frame
    const outer = document.getElementById('outerFrame');
    const interactElements = document.querySelectorAll('h1, p, .button, .profile-container, .datetime-container');

    interactElements.forEach(el => {
      el.addEventListener('mouseenter', () => {
        outer.classList.add('hover-effect');
      });
      el.addEventListener('mouseleave', () => {
        outer.classList.remove('hover-effect');
      });
    });

    // ดาวลอยสุ่ม
    function createFloatingStar() {
      const star = document.createElement('div');
      star.className = 'floating-star';
      star.innerHTML = ['⭐', '✨', '🌟', '💫'][Math.floor(Math.random() * 4)];
      star.style.left = Math.random() * 100 + '%';
      star.style.animationDuration = (Math.random() * 3 + 4) + 's';
      star.style.animationDelay = Math.random() * 2 + 's';
      document.body.appendChild(star);
      setTimeout(() => star.remove(), 7000);
    }
    setInterval(createFloatingStar, 1500);
  </script>
</body>
</html>
